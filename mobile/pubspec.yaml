name: brics_mobile
description: BRICS supervisor app — offline-first field app for production, attendance, GRN and dispatch.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

# Versions resolved by `flutter pub add` against Flutter 3.47 / Dart 3.13; pubspec.lock is committed.
dependencies:
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.1
  intl: ^0.20.3
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  # The shared brand: logo icon + brand.json, copied from the repo's assets/brand/ by `pnpm brand:sync`.
  assets:
    - assets/brand/
  # Inter, bundled so the app looks right offline (docs/05). OFL licence in assets/fonts/OFL.txt.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
    # The logo wordmark (heavy geometric sans). Latin subsets; OFL licence in assets/fonts/OFL-Montserrat.txt.
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800

# Launcher icon and native splash: icon only (no text), generated from the shared brand by
# scripts/brand/generate-icons.py and copied here by `pnpm brand:sync`. Text changes never need these
# regenerated. Regenerate after a new icon: dart run flutter_launcher_icons && dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/ios-icon.png
  adaptive_icon_background: "#2D6A43"
  adaptive_icon_foreground: assets/brand/android-foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F8FAF9"
  image: assets/brand/splash-icon.png
  android_12:
    color: "#F8FAF9"
    image: assets/brand/splash-icon.png
