name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brics
          POSTGRES_PASSWORD: brics
          POSTGRES_DB: brics
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Backend env — test values only, never real secrets here
      NODE_ENV: test
      DATABASE_URL: postgres://brics:brics@localhost:5432/brics
      TEST_DATABASE_URL: postgres://brics:brics@localhost:5432/brics_test
      DATABASE_SSL: 'false'
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      CORS_ORIGINS: http://localhost:3000
      # Web
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @brics/shared build

      - name: Create test database
        run: |
          PGPASSWORD=brics psql -h localhost -U brics -d brics -c "CREATE DATABASE brics_test OWNER brics;"

      - name: Run migrations (main + test DB)
        run: |
          pnpm --filter @brics/backend migration:run
          DATABASE_URL=$TEST_DATABASE_URL pnpm --filter @brics/backend migration:run

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: E2E tests (backend)
        run: pnpm --filter @brics/backend test:e2e

      - name: Build all
        run: pnpm build
